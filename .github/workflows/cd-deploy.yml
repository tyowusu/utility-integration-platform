name: CD — publish, deploy and verify

# =============================================================================
# PROMOTION PIPELINE
#
#   build once  →  Exchange  →  dev  →  QA suite  →  test  →  QA + perf
#                                                        →  [approval]  →  prod
#
# The artifact is built exactly once, at the start, and the same binary is
# promoted through every environment. Rebuilding per environment is the most
# common way a pipeline ends up running something in production that no
# environment ever tested — a fresh dependency resolution can pull a different
# patch version of a connector, and nothing in the diff shows it.
#
# Authentication throughout is a Connected App with client credentials. It is
# scoped to the environments the pipeline touches, revoked independently of any
# person, and does not break when someone enables MFA or leaves.
# =============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

concurrency:
  # Deployments to the same environment must not interleave. CloudHub 2.0
  # will accept two concurrent deployments of the same app and the outcome
  # depends on which finishes last, which is not a thing to leave to chance.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: '17'
  ANYPOINT_URI: 'https://anypoint.mulesoft.com'

jobs:
  # ===========================================================================
  # 1. BUILD ONCE
  # ===========================================================================
  build:
    name: Build and publish to Exchange
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: >
            [
              { "id": "anypoint-exchange-v3", "url": "https://maven.anypoint.mulesoft.com/api/v3/maven" },
              { "id": "mulesoft-releases", "url": "https://repository.mulesoft.org/releases/" }
            ]
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      - name: Generate throwaway keystores for MUnit
        run: |
          chmod +x scripts/bootstrap-local-dev.sh
          ./scripts/bootstrap-local-dev.sh

      - name: Resolve version
        id: version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build and test
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
            -Dmule.env=local \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_LOCAL || 'localdevkey12345' }}

      # Publishing to Exchange makes the release an immutable, versioned,
      # discoverable artifact. A deployment can then be traced to a specific
      # Exchange version rather than to "whatever main looked like that day".
      - name: Publish to Anypoint Exchange
        run: |
          mvn --batch-mode --no-transfer-progress deploy -DskipTests \
            -Danypoint.orgId=${{ secrets.ANYPOINT_ORG_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: mule-application
          path: target/*-mule-application.jar
          retention-days: 30

  # ===========================================================================
  # 2. DEPLOY TO DEV
  # ===========================================================================
  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: >
            [
              { "id": "anypoint-exchange-v3", "url": "https://maven.anypoint.mulesoft.com/api/v3/maven" },
              { "id": "mulesoft-releases", "url": "https://repository.mulesoft.org/releases/" }
            ]
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy to CloudHub 2.0
        id: deploy
        run: |
          # -DskipTests and -Dmule.artifact: deploy the artifact that was
          # already built and tested, rather than rebuilding it here.
          mvn --batch-mode --no-transfer-progress deploy -DmuleDeploy -DskipTests -Pdev \
            -Dmule.artifact=$(ls target/*-mule-application.jar) \
            -DconnectedApp.clientId=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }} \
            -DconnectedApp.clientSecret=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }} \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_DEV }} \
            -Dautodiscovery.clientId=${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_DEV }} \
            -Dautodiscovery.clientSecret=${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET_DEV }} \
            -Dapi.id=${{ secrets.API_INSTANCE_ID_DEV }} \
            -Danypoint.orgId=${{ secrets.ANYPOINT_ORG_ID }}

          echo "app_url=${{ secrets.API_BASE_URL_DEV }}" >> "$GITHUB_OUTPUT"

      # CloudHub 2.0 reports the deployment as complete before the replica is
      # actually serving. Running the test suite immediately produces a
      # confusing connection-refused failure that looks like a test defect.
      - name: Wait for the application to start serving
        run: |
          echo "Waiting for ${{ secrets.API_BASE_URL_DEV }} to respond..."
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" \
              "${{ secrets.API_BASE_URL_DEV }}/api/supply-points/12345678901234/eligibility" || echo "000")
            # Any HTTP response means the listener is up. 401/403 is a
            # *good* sign here: it means the gateway is in front and
            # enforcing, which is exactly what the QA suite goes on to prove.
            if [ "$code" != "000" ]; then
              echo "Application responding with HTTP ${code} after ${i} attempts."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Application did not respond within 10 minutes."
          exit 1

  # ===========================================================================
  # 3. VERIFY DEV
  # ===========================================================================
  verify-dev:
    name: QA suite against dev
    needs: deploy-dev
    uses: ./.github/workflows/api-tests.yml
    with:
      environment: dev
      run_writes: true
      run_gateway_policies: true
    secrets: inherit

  # ===========================================================================
  # 4. DEPLOY TO TEST
  # ===========================================================================
  deploy-test:
    name: Deploy to test
    needs: [build, verify-dev]
    if: github.event_name == 'push' || inputs.target_environment == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy to CloudHub 2.0
        run: |
          mvn --batch-mode --no-transfer-progress deploy -DmuleDeploy -DskipTests -Ptest \
            -Dmule.artifact=$(ls target/*-mule-application.jar) \
            -DconnectedApp.clientId=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }} \
            -DconnectedApp.clientSecret=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }} \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_TEST }} \
            -Dautodiscovery.clientId=${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_TEST }} \
            -Dautodiscovery.clientSecret=${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET_TEST }} \
            -Dapi.id=${{ secrets.API_INSTANCE_ID_TEST }} \
            -Danypoint.orgId=${{ secrets.ANYPOINT_ORG_ID }}

      - name: Wait for the application to start serving
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" \
              "${{ secrets.API_BASE_URL_TEST }}/api/supply-points/12345678901234/eligibility" || echo "000")
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Application did not respond within 10 minutes."
          exit 1

  # ===========================================================================
  # 5. FULL REGRESSION + PERFORMANCE AGAINST TEST
  # ===========================================================================
  verify-test:
    name: Regression + performance against test
    needs: deploy-test
    uses: ./.github/workflows/api-tests.yml
    with:
      environment: test
      run_writes: true
      run_gateway_policies: true
      run_performance: true
    secrets: inherit

  # ===========================================================================
  # 6. PRODUCTION — behind a manual approval
  # ===========================================================================
  deploy-prod:
    name: Deploy to production
    needs: [build, verify-test]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target_environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure this GitHub Environment with required reviewers. A production
    # switching deployment transmits real requests to a regulated counterparty
    # under the Seller's operator code; that warrants a human in the loop, and
    # around the 10th of the month it warrants a deployment window too.
    # No url: here. The secrets context is not available in environment.url —
    # only github, inputs, vars, needs and steps are — and referencing it
    # makes the whole workflow file invalid, not just this job. GitHub reports
    # that as "This run likely failed because of a workflow file issue" with
    # no jobs and no annotation naming the line, so it is worth knowing.
    #
    # Use vars.API_BASE_URL_PROD (a repository *variable*, not a secret) if the
    # deployment URL is wanted on the environment card. A public URL is not a
    # credential, so a variable is the right home for it anyway.
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      # ------------------------------------------------------------------
      # Deadline guard.
      #
      # The 8th to the 11th of the month is when switching requests for the
      # following month cluster against the ARERA deadline. A rolling
      # restart during that window drops in-flight submissions that cannot
      # be retried tomorrow — the window has closed and the customer waits
      # an extra month.
      #
      # Overridable, because a genuine incident fix must not be blocked by
      # a calendar check. But it should be a decision, not an accident.
      # ------------------------------------------------------------------
      - name: Deadline window check
        if: vars.OVERRIDE_DEADLINE_GUARD != 'true'
        run: |
          DAY=$(date -u +%d)
          DAY=$((10#$DAY))
          if [ "$DAY" -ge 8 ] && [ "$DAY" -le 11 ]; then
            echo "::error::Today is day ${DAY}. This is the ARERA submission deadline window (Delibera 77/2018/R/com)."
            echo "::error::A rolling restart now risks dropping submissions that cannot be retried before the window closes."
            echo "::error::Set repository variable OVERRIDE_DEADLINE_GUARD=true to proceed anyway."
            exit 1
          fi
          echo "Day ${DAY} is outside the deadline window. Proceeding."

      - name: Deploy to CloudHub 2.0
        run: |
          mvn --batch-mode --no-transfer-progress deploy -DmuleDeploy -DskipTests -Pprod \
            -Dmule.artifact=$(ls target/*-mule-application.jar) \
            -DconnectedApp.clientId=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }} \
            -DconnectedApp.clientSecret=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }} \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_PROD }} \
            -Dautodiscovery.clientId=${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_PROD }} \
            -Dautodiscovery.clientSecret=${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET_PROD }} \
            -Dapi.id=${{ secrets.API_INSTANCE_ID_PROD }} \
            -Danypoint.orgId=${{ secrets.ANYPOINT_ORG_ID }}

      - name: Wait for the application to start serving
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" \
              "${{ secrets.API_BASE_URL_PROD }}/api/supply-points/12345678901234/eligibility" || echo "000")
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Application did not respond within 15 minutes."
          exit 1

  # ===========================================================================
  # 7. PRODUCTION SMOKE — read-only
  # ===========================================================================
  verify-prod:
    name: Production smoke
    needs: deploy-prod
    uses: ./.github/workflows/api-tests.yml
    with:
      environment: prod
      # Writes are off. A successful POST against production is a genuine
      # regulated transmission to the SII under the Seller's operator code,
      # and cancelling it afterwards still counts against the Seller in ARERA
      # commercial-quality reporting.
      run_writes: false
      run_gateway_policies: true
      run_performance: false
    secrets: inherit
