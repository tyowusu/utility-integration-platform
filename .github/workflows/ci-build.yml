name: CI — build and unit test

# =============================================================================
# Runs on every push and pull request. Fast, hermetic, no deployment.
#
# The gate this workflow enforces is MUnit coverage, not merely MUnit passing.
# In a regulated integration the DataWeave rule modules are what an ARERA
# resolution changes; a suite that passes while coverage silently erodes is a
# suite that will not notice the next amendment.
# =============================================================================

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build + MUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -----------------------------------------------------------------
      # Anypoint Exchange is a private Maven repository. The connectors
      # this application depends on are not on Maven Central, so without
      # credentials the build fails at dependency resolution with an
      # unhelpful 401 rather than anything that names the cause.
      # -----------------------------------------------------------------
      - name: Configure Maven settings for Anypoint Exchange
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: >
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              },
              {
                "id": "mulesoft-private",
                "username": "${{ secrets.MULESOFT_NEXUS_USERNAME || 'not-configured' }}",
                "password": "${{ secrets.MULESOFT_NEXUS_PASSWORD || 'not-configured' }}"
              }
            ]

      # -----------------------------------------------------------------
      # The application builds a TLS context and resolves its secure
      # properties file at startup — neither is lazy — so it cannot boot,
      # and therefore cannot run a single MUnit test, until throwaway
      # keystores exist on the classpath. This generates them.
      # -----------------------------------------------------------------
      - name: Generate throwaway keystores and local secrets
        run: |
          chmod +x scripts/bootstrap-local-dev.sh
          ./scripts/bootstrap-local-dev.sh

      # -----------------------------------------------------------------
      # MUnit boots a real Mule runtime. For an application depending on
      # any EE-only connector — here anypoint-mq — that runtime is Mule EE,
      # and Mule EE resolves com.mulesoft.licm:licm from MuleSoft's private
      # Nexus, which requires a paid support entitlement. Those credentials
      # are distinct from the Anypoint Exchange credentials above.
      #
      # Without them the tests cannot run at all: the failure is a 401 on
      # licm, not a test failure, and no change to this repository fixes
      # it. Failing the build on a missing entitlement would report a
      # problem the contributor cannot act on, so the suite is skipped and
      # the omission is stated loudly instead.
      # -----------------------------------------------------------------
      - name: Check for Mule EE runtime entitlement
        id: ee
        run: |
          if [ -n "${{ secrets.MULESOFT_NEXUS_USERNAME }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run MUnit with coverage gate
        if: steps.ee.outputs.available == 'true'
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
            -Dmule.env=local \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_LOCAL || 'localdevkey12345' }}

      - name: Build without MUnit — no Mule EE runtime entitlement
        if: steps.ee.outputs.available != 'true'
        run: |
          echo "::warning title=MUnit skipped::MULESOFT_NEXUS_USERNAME is not set, so a Mule EE runtime cannot be downloaded and MUnit cannot run. The application is still compiled and packaged, and every Mule XML config and DataWeave script is still validated. Run the suites locally in Anypoint Studio, or add the private-repo credentials as secrets to enable this gate."
          mvn --batch-mode --no-transfer-progress clean package \
            -DskipMunitTests \
            -Dmule.env=local \
            -Dmule.secure.key=${{ secrets.MULE_SECURE_KEY_LOCAL || 'localdevkey12345' }}

      - name: Publish MUnit results
        if: always() && steps.ee.outputs.available == 'true'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'target/surefire-reports/*.xml'
          check_name: 'MUnit results'
          fail_on_failure: true

      - name: Upload coverage report
        if: always() && steps.ee.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: munit-coverage
          path: target/site/munit/coverage/
          retention-days: 14

      # The artifact built here is the one that gets promoted. Rebuilding
      # per environment would mean production runs a binary no environment
      # ever tested.
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-application
          path: target/*-mule-application.jar
          retention-days: 30

  api-governance:
    name: API spec lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The RAML is the contract three consumer teams build against. Linting
      # it in CI catches a breaking change while it is still a pull request,
      # rather than after the portals have deployed against it.
      - name: Install linters
        run: npm install -g @stoplight/spectral-cli raml-cop

      - name: Validate RAML
        run: raml-cop src/main/resources/api/switching-eapi.raml

  qa-suite-compiles:
    name: QA automation compiles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # The QA suite is not run here — it needs a deployed environment. But
      # it is compiled, so a broken test suite is caught on the pull request
      # that broke it rather than at 2am during a deployment.
      - name: Compile test sources
        working-directory: qa-automation
        run: mvn --batch-mode --no-transfer-progress test-compile
